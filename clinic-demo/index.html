const slotName=sl=>fmt(sl.s)+' \u2013 '+fmt(sl.e);

/* ---- storage: Firestore if configured, else this-browser demo ---- */
if(FB){firebase.initializeApp(FB);db=firebase.firestore()}
const S={
 async get(c,i){if(db){const d=await db.collection(c).doc(i).get();return d.exists?d.data():null}const v=localStorage.getItem(c+'/'+i);return v?JSON.parse(v):null},
 async set(c,i,v){if(db)return db.collection(c).doc(i).set(v);localStorage.setItem(c+'/'+i,JSON.stringify(v))},
 async upd(c,i,fn){if(db){const r=db.collection(c).doc(i);return db.runTransaction(async x=>{const d=await x.get(r);const nv=fn(d.exists?d.data():null);x.set(r,nv);return nv})}const nv=fn(await S.get(c,i));await S.set(c,i,nv);return nv},
 async del(c,i){if(db)return db.collection(c).doc(i).delete();localStorage.removeItem(c+'/'+i)}};
const getMeta=async()=>{let m=await S.get('meta','settings');if(!m){m={users:[{u:'admin',p:'demo123'}],notice:'',closures:[]};await S.set('meta','settings',m)}m.users=m.users||[];m.closures=m.closures||[];return m};

/* ---- slot logic: running slot + the next one only ---- */
async function openSlots(){const n=new Date(),seq=[];
 for(let d=0;d<3;d++)for(const sl of SL){const dt=new Date(n.getFullYear(),n.getMonth(),n.getDate()+d);seq.push({dt,sl})}
 const at=(x,h)=>{const z=new Date(x.dt);z.setHours(Math.floor(h),(h%1)*60,0,0);return z};
 const live=seq.filter(x=>at(x,x.sl.e)>n).map(x=>({...x,key:ds(x.dt)+'_'+x.sl.id}));
 const out=[live[0]];
 if(at(live[0],live[0].sl.s)<=n){const v=await S.get('slots',live[0].key);if(v&&v.list.some(p=>p.done))out.push(live[1])}
 return out}
const closedMsg=(m,date)=>{const c=m.closures.find(c=>date>=c.from&&date<=c.to);return c?c.msg:null};
const etaOf=(x,ahead)=>{const st=new Date(x.dt);st.setHours(Math.floor(x.sl.s),0,0,0);const e=new Date(Math.max(Date.now(),st.getTime())+ahead*MIN_PER*60000);return e};

function go(v){view=v;drawer.classList.remove('o');render()}
function drawerHtml(){drawer.innerHTML=`<button onclick="go('home')">\ud83c\udfe0 ${t('home')}</button>`+(me?`<button onclick="go('admin')">\ud83e\ude7a Admin</button><button onclick="me=null;sessionStorage.removeItem('me');go('home')">${t('logout')}</button>`:`<button onclick="go('login')">\ud83d\udd10 ${t('login')}</button>`)}
function toggleLang(){lang=lang=='hi'?'en':'hi';localStorage.lang=lang;render()}
function pruneTks(){tks=tks.filter(k=>endOf(k)>new Date());localStorage.tks=JSON.stringify(tks)}
async function render(){pruneTks();lg.innerHTML=lang=='hi'?'\u0939\u093f\u0902 | <span style="opacity:.5">En</span>':'<span style="opacity:.5">\u0939\u093f\u0902</span> | En';ttl.textContent='\ud83c\udfe5 '+t('clinic');drawerHtml();const f={home,book,status,login,admin}[view];app.innerHTML='';await f()}

async function home(){const m=await getMeta();
 app.innerHTML=`<h2>${t('welcome')}</h2><p class="sm">${t('time')}</p>${m.notice?`<div class="warn">\ud83d\udce2 ${esc(m.notice)}</div>`:''}
 <button class="big" onclick="go('book')">\ud83e\ude7a ${t('chk')}</button>
 <button class="big" id="sb" ${tks.length?'':'disabled'} onclick="go('status')">\ud83d\udd22 ${t('stat')}</button>`}

async function book(){const m=await getMeta(),os=await openSlots();
 const opts=os.map((x,i)=>`<option value="${i}">${ds(x.dt)} \u2022 ${slotName(x.sl)}</option>`).join('');
 app.innerHTML=`<button class="ghost" onclick="go('home')">${t('back')}</button><div class="card" style="margin-top:12px">
 ${m.notice?`<div class="warn">\ud83d\udce2 ${esc(m.notice)}</div>`:''}
 <label>${t('slot')}</label><select id="sl">${opts}</select>
 <label>${t('name')}</label><input id="nm" autocomplete="name">
 <label>${t('mob')}</label><input id="mb" type="tel" maxlength="10" inputmode="numeric">
 <label>${t('seen')}</label><select id="rp"><option value="0">${t('no')}</option><option value="1">${t('yes')}</option></select>
 <button class="btn" style="width:100%" onclick="doBook()">${t('book')}</button><div id="msg" style="margin-top:12px"></div></div>`}
async function doBook(){const m=await getMeta(),x=(await openSlots())[+sl.value],nm_=nm.value.trim(),mb_=mb.value.trim();
 const say=(h,w)=>msg.innerHTML=`<div class="${w?'warn':'card'}">${h}</div>`;
 if(!nm_||!/^\d{10}$/.test(mb_))return say(t('bad'),1);
 const cm=closedMsg(m,ds(x.dt));if(cm)return say('\ud83d\udeab '+t('closed')+': '+esc(cm),1);
 if(tks.filter(k=>k.key==x.key).length>=3)return say(t('lim'),1);
 try{let n=0,ahead=0;await S.upd('slots',x.key,v=>{v=v||{list:[]};const act=v.list.filter(p=>!p.x);if(act.length>=MAX)throw 'FULL';if(act.some(p=>p.mb===mb_&&p.nm.toLowerCase()===nm_.toLowerCase()))throw 'DUP';ahead=act.filter(p=>!p.done).length;n=v.list.reduce((a,p)=>Math.max(a,p.n),0)+1;v.list.push({n,nm:nm_,mb:mb_,r:rp.value=='1',done:false,x:false,dv:DV});return v});
  tks.push({key:x.key,n,nm:nm_,mb:mb_,date:ds(x.dt),sid:x.sl.id});localStorage.tks=JSON.stringify(tks);
  say('\u2705 '+esc((()=>{const e=etaOf(x,ahead);return t('conf')(n,ds(x.dt),fmt(e.getHours()+e.getMinutes()/60),Math.max(0,Math.round((e-Date.now())/60000)))})()))}
 catch(e){say(e=='FULL'?t('full'):e=='DUP'?t('dup'):String(e),1)}}

async function status(){pruneTks();if(!tks.length)return app.innerHTML=`<div class="warn">${t('notk')}</div>`;
 let h=`<button class="ghost" onclick="go('home')">${t('back')}</button>`;
 for(const k of tks){const v=await S.get('slots',k.key),l=v?v.list:[],mine=l.find(p=>p.n==k.n),pend=l.filter(p=>!p.done&&!p.x),dn=l.filter(p=>p.done).sort((a,b)=>(b.dt||0)-(a.dt||0)||b.n-a.n),cur=dn.length?dn[0].n:(pend.length?pend[0].n:null);
 h+=`<div class="card" style="margin-top:12px"><div class="sm">${esc(k.nm)} \u2022 ${k.date} \u2022 ${slotName(SL.find(s=>s.id==k.sid))}</div>
 <p>${t('your')}</p><div class="num">${k.n}</div><p>${t('cur')}</p><div class="num">${cur??t('nonow')}</div>
 ${mine&&mine.x?`<p>\ud83d\udeab ${t('cx')}</p>`:mine&&mine.done?`<p>\u2705 ${t('treated')}</p>`:`<p>${t('ahead')}: <b>${pend.filter(p=>p.n<k.n).length}</b></p>`}</div>`}
 app.innerHTML=h;clearTimeout(window._p);window._p=setTimeout(()=>{if(view=='status')status()},8000)}

async function login(){app.innerHTML=`<div class="card"><label>${t('uid')}</label><input id="u" autocapitalize="none" value="admin"><label>${t('pw')}</label><input id="p" type="password" value="demo123"><p class="sm" style="margin-top:10px">Demo login: admin / demo123</p><button class="btn" style="width:100%" onclick="doLogin()">${t('go')}</button><div id="msg" class="warn" style="display:none;margin-top:12px">${t('wrong')}</div></div>`}
async function doLogin(){const m=await getMeta();if(m.users.some(x=>x.u==u.value.trim()&&x.p==p.value)){me=u.value.trim();sessionStorage.me=me;cleanup();go('admin')}else msg.style.display='block'}
async function cleanup(){const k='clean',today=ds(new Date());if(localStorage[k]==today)return;
 for(let d=31;d<=60;d++){const dt=new Date();dt.setDate(dt.getDate()-d);for(const sl of SL)await S.del('slots',ds(dt)+'_'+sl.id)}localStorage[k]=today}

let tab='queue',aslot=null;
async function admin(){if(!me)return go('login');const m=await getMeta(),os=await openSlots();
 const list=[];for(let d=-1;d<=2;d++)for(const sl of SL){const dt=new Date();dt.setDate(dt.getDate()+d);list.push({dt,sl,key:ds(dt)+'_'+sl.id})}
 aslot=aslot||os[0].key;
 const tabs=`<div class="tabs">${['queue','notice','users'].map(k=>`<button class="ghost ${tab==k?'on':''}" onclick="tab='${k}';admin()">${t(k)}</button>`).join('')}</div>`;
 let h=tabs;
 if(tab=='queue'){const v=await S.get('slots',aslot),l=v?v.list:[],P=l.filter(p=>!p.done&&!p.x),Dn=l.filter(p=>p.done&&!p.x),Cx=l.filter(p=>p.x),dc={};l.forEach(p=>{if(!p.x&&p.dv)dc[p.dv]=(dc[p.dv]||0)+1});
  h+=`<select onchange="aslot=this.value;admin()">${list.map(x=>`<option value="${x.key}" ${x.key==aslot?'selected':''}>${ds(x.dt)} \u2022 ${slotName(x.sl)}</option>`).join('')}</select>
  <div class="card"><b>${t('pending')}: ${P.length}</b> / ${l.length-Cx.length}${P.length?'':`<p class="sm">${t('empty')}</p>`}
  ${P.map(p=>`<div class="row"><b>${p.n}</b><span>${esc(p.nm)}${p.r?' (R)':''}<br><small>${esc(p.mb)}${p.dv&&dc[p.dv]>1?' \ud83d\udcf1\u00d7'+dc[p.dv]:''}</small></span><button class="btn" onclick="treat(${p.n})">\u2714 ${t('treat')}</button><button class="ghost" onclick="cancelP(${p.n})">\u2716</button></div>`).join('')}</div>
  ${Dn.length?`<div class="card sm"><b>${t('tdone')}</b>${Dn.map(p=>`<div class="row done"><b>${p.n}</b><span>${esc(p.nm)}${p.r?' (R)':''} ${esc(p.mb)}</span></div>`).join('')}</div>`:''}${Cx.length?`<div class="card sm"><b>${t('cx')}</b>${Cx.map(p=>`<div class="row done"><b>${p.n}</b><span>${esc(p.nm)} ${esc(p.mb)}</span></div>`).join('')}</div>`:''}`}
 if(tab=='notice'){h+=`<div class="card"><label>${t('ntxt')}</label><textarea id="nt" rows="3">${esc(m.notice)}</textarea><button class="btn" onclick="saveNotice()">${t('save')}</button></div>
  <div class="card"><b>${t('closeTitle')}</b><br><label>${t('from')}</label><input type="date" id="cf"><label>${t('to')}</label><input type="date" id="ct"><label>${t('cmsg')}</label><input id="cmg"><button class="btn" onclick="addClosure()">${t('add')}</button>
  ${m.closures.map((c,i)=>`<div class="row"><span>${c.from} \u2192 ${c.to}<br><small>${esc(c.msg)}</small></span><button class="ghost" onclick="delClosure(${i})">${t('del')}</button></div>`).join('')}</div>`}
 if(tab=='users'){h+=`<div class="card"><b>${t('newu')}</b><label>${t('uid')}</label><input id="nu" autocapitalize="none"><label>${t('pw')}</label><input id="np"><button class="btn" onclick="addUser()">${t('save')}</button>
  ${m.users.map(x=>`<div class="row"><span>\ud83d\udc64 ${esc(x.u)}</span></div>`).join('')}</div>`}
 app.innerHTML=h;clearTimeout(window._a);if(tab=='queue')window._a=setTimeout(()=>{if(view=='admin'&&tab=='queue')admin()},10000)}
async function treat(n){await S.upd('slots',aslot,v=>{const p=v.list.find(x=>x.n==n);if(p){p.done=true;p.dt=Date.now()}return v});admin()}
async function cancelP(n){if(!confirm(t('sure')))return;await S.upd('slots',aslot,v=>{const p=v.list.find(x=>x.n==n);if(p)p.x=true;return v});admin()}
async function saveNotice(){const m=await getMeta();m.notice=nt.value.trim();await S.set('meta','settings',m);alert(t('saved'))}
async function addClosure(){if(!cf.value||!ct.value)return;const m=await getMeta();m.closures.push({from:cf.value,to:ct.value,msg:cmg.value.trim()||t('closed')});await S.set('meta','settings',m);admin()}
async function delClosure(i){const m=await getMeta();m.closures.splice(i,1);await S.set('meta','settings',m);admin()}
async function addUser(){const a=nu.value.trim(),b=np.value;if(!a||!b)return;const m=await getMeta();if(m.users.some(x=>x.u==a))return;m.users.push({u:a,p:b});await S.set('meta','settings',m);alert(t('reuse'));admin()}
(function(){
 if(localStorage.getItem('meta/settings'))return;
 var now=new Date(),first=null;
 outer:for(var d=0;d<3;d++)for(var i=0;i<SL.length;i++){var dt=new Date(now.getFullYear(),now.getMonth(),now.getDate()+d);var e=new Date(dt.getFullYear(),dt.getMonth(),dt.getDate(),SL[i].e);if(e>now){first={dt:dt,i:i};break outer}}
 localStorage.setItem('meta/settings',JSON.stringify({users:[{u:'admin',p:'demo123'}],notice:'Sample notice: please carry your previous prescription.',closures:[]}));
 var nm=['Ramesh Patil','Sunita Kale','Anil Deshmukh','Kavita Wagh','Mahesh Thakre','Anita Raut','Vijay Bhoyar','Rekha Ingole','Prakash Dhoke','Meena Zade','Sanjay Nimje','Seema Bagde','Dinesh Dongre','Pooja Pande'];
 function mk(from,count,doneN,cancelAt){var list=[];for(var k=0;k<count;k++){var n=k+1;list.push({n:n,nm:nm[(from+k)%nm.length],mb:'98765'+String(10000+(from+k)*37),r:k%4==0,done:k<doneN,x:k===cancelAt,dv:'d'+(from+k),dt:k<doneN?Date.now()-(doneN-k)*600000:undefined})}return {list:list}}
 var s1=ds(first.dt)+'_'+SL[first.i].id,j=first.i+1,dt2=first.dt;if(j>=SL.length){j=0;dt2=new Date(first.dt.getFullYear(),first.dt.getMonth(),first.dt.getDate()+1)}
 localStorage.setItem('slots/'+s1,JSON.stringify(mk(0,11,4,6)));
 localStorage.setItem('slots/'+ds(dt2)+'_'+SL[j].id,JSON.stringify(mk(5,5,0,-1)));
})();

render();
