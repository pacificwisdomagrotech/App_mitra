<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><meta name="theme-color" content="#5b3a9b">
<title>Institute Management App - Demo</title>
<script src="https://cdn.tailwindcss.com/3.4.17"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>@import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800;900&display=swap');

:root {
    --primary-gradient: linear-gradient(135deg, #6366f1 0%, #8b5cf6 50%, #a855f7 100%);
    --secondary-gradient: linear-gradient(135deg, #10b981 0%, #34d399 100%);
    --accent-gradient: linear-gradient(135deg, #f59e0b 0%, #fbbf24 100%);
    --danger-gradient: linear-gradient(135deg, #ef4444 0%, #f87171 100%);
    --info-gradient: linear-gradient(135deg, #0ea5e9 0%, #38bdf8 100%);
    --purple-gradient: linear-gradient(135deg, #a855f7 0%, #c084fc 100%);
    --pink-gradient: linear-gradient(135deg, #ec4899 0%, #f472b6 100%);
    --cyan-gradient: linear-gradient(135deg, #06b6d4 0%, #22d3ee 100%);
    --orange-gradient: linear-gradient(135deg, #f97316 0%, #fb923c 100%);
}

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html, body {
    height: 100%;
    width: 100%;
    overflow-x: hidden;
}

body {
    font-family: 'Poppins', sans-serif;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 50%, #f093fb 100%);
    background-attachment: fixed;
    color: #1e293b;
    min-height: 100vh;
}

.glass-card {
    background: rgba(255, 255, 255, 0.95);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border: 1px solid rgba(255, 255, 255, 0.3);
    border-radius: 24px;
    box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.15), 0 0 0 1px rgba(255, 255, 255, 0.1) inset;
    transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
    overflow: hidden;
    position: relative;
    width: 100%;
    max-width: 1200px; /* Limit card width for better centering */
}

.glass-card::before {
    content: '';
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    height: 4px;
    background: var(--primary-gradient);
    opacity: 0;
    transition: opacity 0.3s ease;
}

.glass-card:hover::before {
    opacity: 1;
}

.glass-card:hover {
    transform: translateY(-8px) scale(1.01);
    box-shadow: 0 35px 60px -15px rgba(0, 0, 0, 0.2), 0 0 0 1px rgba(255, 255, 255, 0.2) inset;
}

.gradient-text {
    background: var(--primary-gradient);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
}

/* Vibrant Buttons */
.btn-primary-gradient {
    background: var(--primary-gradient);
    transition: all 0.3s ease;
    position: relative;
    overflow: hidden;
}

.btn-primary-gradient::before {
    content: '';
    position: absolute;
    top: 0;
    left: -100%;
    width: 100%;
    height: 100%;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
    transition: left 0.5s ease;
}

.btn-primary-gradient:hover::before {
    left: 100%;
}

.btn-primary-gradient:hover {
    transform: translateY(-3px);
    box-shadow: 0 10px 25px rgba(99, 102, 241, 0.4);
}

.btn-secondary-gradient { background: var(--secondary-gradient); transition: all 0.3s ease; }
.btn-secondary-gradient:hover {
    transform: translateY(-3px);
    box-shadow: 0 10px 25px rgba(16, 185, 129, 0.4);
}

.btn-accent-gradient { background: var(--accent-gradient); transition: all 0.3s ease; color: white; }
.btn-accent-gradient:hover {
    transform: translateY(-3px);
    box-shadow: 0 10px 25px rgba(245, 158, 11, 0.4);
}

.btn-danger-gradient { background: var(--danger-gradient); transition: all 0.3s ease; }
.btn-danger-gradient:hover {
    transform: translateY(-3px);
    box-shadow: 0 10px 25px rgba(239, 68, 68, 0.4);
}

.btn-info-gradient { background: var(--info-gradient); transition: all 0.3s ease; }
.btn-info-gradient:hover {
    transform: translateY(-3px);
    box-shadow: 0 10px 25px rgba(14, 165, 233, 0.4);
}

.btn-purple-gradient { background: var(--purple-gradient); transition: all 0.3s ease; }
.btn-purple-gradient:hover {
    transform: translateY(-3px);
    box-shadow: 0 10px 25px rgba(168, 85, 247, 0.4);
}

.btn-cyan-gradient { background: var(--cyan-gradient); transition: all 0.3s ease; color: white; }
.btn-cyan-gradient:hover {
    transform: translateY(-3px);
    box-shadow: 0 10px 25px rgba(6, 182, 212, 0.4);
}

.btn-orange-gradient { background: var(--orange-gradient); transition: all 0.3s ease; color: white; }
.btn-orange-gradient:hover {
    transform: translateY(-3px);
    box-shadow: 0 10px 25px rgba(249, 115, 22, 0.4);
}

/* Navigation */
.sidebar-link {
    transition: all 0.3s ease;
    border-radius: 12px;
    position: relative;
    overflow: hidden;
}

.sidebar-link:hover {
    background: rgba(99, 102, 241, 0.1);
    color: #6366f1;
    transform: translateX(4px);
}

.sidebar-link.active {
    background: var(--primary-gradient);
    color: white;
    box-shadow: 0 4px 15px rgba(99, 102, 241, 0.3);
}

/* Status Badges */
.badge {
    padding: 0.35rem 1rem;
    border-radius: 9999px;
    font-size: 0.75rem;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.05em;
}

.badge-success { background: linear-gradient(135deg, #10b981, #34d399); color: white; }
.badge-error { background: linear-gradient(135deg, #ef4444, #f87171); color: white; }
.badge-warning { background: linear-gradient(135deg, #f59e0b, #fbbf24); color: white; }
.badge-info { background: linear-gradient(135deg, #0ea5e9, #38bdf8); color: white; }

/* Form Styles */
.form-input-styled {
    background: #ffffff;
    border: 2px solid #e2e8f0;
    border-radius: 14px;
    padding: 14px 18px;
    transition: all 0.3s ease;
    font-size: 0.95rem;
    text-align: center; /* Center text in inputs */
}

/* Specific styling for numeric inputs to look like mobile numbers */
input[type="tel"], input[type="number"].mobile-style {
    letter-spacing: 0.1em;
    font-weight: 600;
}

.centered-container {
    display: flex;
    flex-direction: column;
    align-items: center;
    width: 100%;
}

.multi-color-border {
    border-width: 4px;
    border-style: solid;
    border-image: linear-gradient(to right, #6366f1, #10b981, #f59e0b, #ec4899) 1;
}

.form-input-styled:focus {
    border-color: #6366f1;
    box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.15), 0 4px 15px rgba(99, 102, 241, 0.1);
    outline: none;
    transform: translateY(-2px);
}

.dotted-form-section {
    border: 3px dashed;
    padding: 28px;
    border-radius: 20px;
    background: rgba(255, 255, 255, 0.7);
    position: relative;
}

.dotted-form-section::before {
    content: '';
    position: absolute;
    top: -2px;
    left: -2px;
    right: -2px;
    bottom: -2px;
    border-radius: 22px;
    background: linear-gradient(135deg, rgba(99, 102, 241, 0.1), rgba(168, 85, 247, 0.1));
    z-index: -1;
}

/* Colorful Section Headers */
.section-indigo { color: #6366f1; }
.section-indigo .section-line { background: linear-gradient(90deg, #6366f1, #8b5cf6); }

/* Form Label Bold */
.form-label-bold {
    font-weight: 700;
    color: #334155;
    font-size: 0.875rem;
    text-transform: uppercase;
    letter-spacing: 0.025em;
}

.section-emerald { color: #10b981; }
.section-emerald .section-line { background: linear-gradient(90deg, #10b981, #34d399); }

.section-amber { color: #f59e0b; }
.section-amber .section-line { background: linear-gradient(90deg, #f59e0b, #fbbf24); }

.section-purple { color: #a855f7; }
.section-purple .section-line { background: linear-gradient(90deg, #a855f7, #c084fc); }

.section-rose { color: #ec4899; }
.section-rose .section-line { background: linear-gradient(90deg, #ec4899, #f472b6); }

.section-blue { color: #0ea5e9; }
.section-blue .section-line { background: linear-gradient(90deg, #0ea5e9, #38bdf8); }

.section-cyan { color: #06b6d4; }
.section-cyan .section-line { background: linear-gradient(90deg, #06b6d4, #22d3ee); }

.section-orange { color: #f97316; }
.section-orange .section-line { background: linear-gradient(90deg, #f97316, #fb923c); }

/* Stat Cards with Colorful Borders */
.stat-card-indigo { border-left: 5px solid #6366f1; }
.stat-card-emerald { border-left: 5px solid #10b981; }
.stat-card-amber { border-left: 5px solid #f59e0b; }
.stat-card-rose { border-left: 5px solid #ec4899; }
.stat-card-purple { border-left: 5px solid #a855f7; }
.stat-card-blue { border-left: 5px solid #0ea5e9; }

/* Tables */
.table-container {
    background: white;
    border-radius: 16px;
    overflow: hidden;
    box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
}

table thead th {
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    color: white;
    font-weight: 600;
    text-transform: uppercase;
    font-size: 0.75rem;
    letter-spacing: 0.05em;
    padding: 16px;
}

table tbody tr {
    transition: all 0.2s ease;
}

table tbody tr:hover {
    background: linear-gradient(135deg, rgba(99, 102, 241, 0.05), rgba(168, 85, 247, 0.05));
}

/* Modals */
.modal-overlay {
    background: rgba(0, 0, 0, 0.6);
    backdrop-filter: blur(8px);
}

.modal-content {
    background: white;
    border-radius: 24px;
    box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
    animation: modalIn 0.3s ease;
}

@keyframes modalIn {
    from {
        opacity: 0;
        transform: scale(0.95) translateY(20px);
    }
    to {
        opacity: 1;
        transform: scale(1) translateY(0);
    }
}

/* Print Styles */
@media print {
    body {
        background: white !important;
    }
    
    .glass-card {
        box-shadow: none !important;
        border: 1px solid #ddd !important;
    }
    
    nav, footer, button {
        display: none !important;
    }
}
</style>

<script>
(function(){
var WA="917276124898", DEMO_DAYS=3, KEY="am_institute_demo_v1";
/* Optional server check (stops a customer restarting the demo by clearing the browser): paste App Mitra Firebase details */
var SRV={projectId:"app-mitra-90078",apiKey:"AIzaSyCEXC0FoKqcuIYpg8sHc9tSulktIi2D68o"};
var st=null;try{st=JSON.parse(localStorage.getItem(KEY));}catch(e){}
var css=document.createElement("style");
css.textContent="#demoGate{position:fixed;inset:0;z-index:9999;background:#0d1f3c;display:none;align-items:center;justify-content:center;padding:18px;font-family:'Segoe UI',system-ui,sans-serif}#demoGate .b{background:#fff;color:#1a1a2e;border-radius:18px;padding:22px;max-width:380px;width:100%}#demoGate h2{font-size:21px;margin-bottom:6px}#demoGate p{color:#555;font-size:14px;margin-bottom:12px}#demoGate input{width:100%;padding:12px;border:1.5px solid #dfe4ef;border-radius:10px;font-size:15px;margin-bottom:10px}#demoGate button,#demoGate a.bt{display:block;width:100%;border:0;border-radius:10px;padding:13px;font-size:15px;font-weight:600;text-align:center;text-decoration:none;color:#fff;background:#1a3a6b;cursor:pointer}#demoGate a.wa{background:#1faa59}#demoGate .e{color:#dc2626;font-size:13px;min-height:18px;margin-bottom:6px}#demoFloat{position:fixed;right:10px;bottom:20px;z-index:90;display:none;flex-direction:column;align-items:flex-end;gap:6px;font-family:'Segoe UI',system-ui,sans-serif}#demoFloat a{background:#1faa59;color:#fff;text-decoration:none;font-weight:600;font-size:13px;padding:9px 13px;border-radius:20px;box-shadow:0 2px 10px rgba(0,0,0,.25)}#demoFloat span{background:#ff9f1c;color:#14213d;font-size:12px;font-weight:600;padding:5px 10px;border-radius:12px}#demoFloat u{font-size:11px;color:#6b7280;cursor:pointer;background:#fff;padding:3px 8px;border-radius:10px}";
document.head.appendChild(css);
var gate=document.createElement("div");gate.id="demoGate";
var fl=document.createElement("div");fl.id="demoFloat";
document.addEventListener("DOMContentLoaded",function(){document.body.appendChild(gate);document.body.appendChild(fl);init();});
function wa(m){return "https://wa.me/"+WA+"?text="+encodeURIComponent(m)}
function who(){return st?(" (Demo user: "+st.name+", "+st.phone+")"):""}
function fsUrl(p){return "https://firestore.googleapis.com/v1/projects/"+SRV.projectId+"/databases/(default)/documents/demos"+p}
function getSrv(phone){
  if(!SRV.projectId||!SRV.apiKey)return Promise.resolve(null);
  return Promise.race([fetch(fsUrl("/"+phone+"_institute?key="+SRV.apiKey)).then(function(r){return r.status===200?r.json():null}).then(function(j){return j&&j.fields&&j.fields.start?Number(j.fields.start.integerValue):null}).catch(function(){return null}),new Promise(function(r){setTimeout(function(){r(null)},2500)})]);
}
function putSrv(n,p,t){
  if(!SRV.projectId||!SRV.apiKey)return;
  fetch(fsUrl("?documentId="+p+"_institute&key="+SRV.apiKey),{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({fields:{name:{stringValue:n},phone:{stringValue:p},start:{integerValue:String(t)}}})}).catch(function(){});
}
function ask(){
  gate.innerHTML='<div class="b"><h2>Start your 3-day demo</h2><p>Enter your details to try the Institute Management App with sample data. No payment needed.</p><input id="dgN" placeholder="Your name" autocomplete="name"><input id="dgP" type="tel" inputmode="numeric" placeholder="10-digit mobile number" autocomplete="tel"><div class="e" id="dgE"></div><button id="dgB">Start demo</button></div>';
  gate.style.display="flex";
  document.getElementById("dgB").onclick=function(){
    var n=document.getElementById("dgN").value.trim(),p=document.getElementById("dgP").value.replace(/\D/g,"").replace(/^91(?=\d{10}$)/,"");
    var e=document.getElementById("dgE");
    if(!n){e.textContent="Please enter your name.";return}
    if(!/^[6-9]\d{9}$/.test(p)){e.textContent="Enter a valid 10-digit mobile number.";return}
    this.disabled=true;this.textContent="Starting...";
    getSrv(p).then(function(prev){var t=prev||Date.now();st={name:n,phone:p,start:t};localStorage.setItem(KEY,JSON.stringify(st));if(!prev)putSrv(n,p,t);init();});
  };
}
function expired(){
  gate.innerHTML='<div class="b"><h2>Your 3-day demo has ended</h2><p>Thank you for trying the Institute Management App. Take the 1-year license and we will set it up with your library name, logo and data.</p><a class="bt wa" href="'+wa("Hi, my 3-day demo of the Institute Management App has ended. I want to buy the 1-year license."+who())+'">Buy 1-year license on WhatsApp</a></div>';
  gate.style.display="flex";fl.style.display="none";
}
function init(){
  if(!st||!st.phone){ask();return}
  var left=st.start+DEMO_DAYS*DAY-Date.now();
  if(left<=0){expired();return}
  gate.style.display="none";
  var d=Math.floor(left/DAY),h=Math.floor(left%DAY/36e5);
  fl.innerHTML='<span>Demo: '+d+'d '+h+'h left</span><a href="'+wa("Hi, I want to buy the 1-year license of the Institute Management App."+who())+'">Buy license</a>';
  fl.style.display="flex";
  setTimeout(init,60000);
}
var DAY=864e5;
})();
</script>
