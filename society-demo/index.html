<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Demo Society - Credit Society App</title>
<meta name="theme-color" content="#24304A">
<style>
/* =====================================================
   Demo Society \2014  Design System
   Visual identity: a physical ledger / passbook book.
   Signature element: the circular "passbook stamp" used
   on paid entries & receipts; ruled "page" cards; tabular
   mono figures for every rupee amount, aligned like a
   real khata column.
   ===================================================== */

@import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600;700&display=swap');

:root{
  --font-display: 'Fraunces', Georgia, serif;
  --font-body: 'Inter', system-ui, sans-serif;
  --font-mono: 'JetBrains Mono', 'Courier New', monospace;

  --radius-card: 14px;
  --radius-pill: 999px;
  --shadow-card: 0 2px 10px rgba(20,20,20,0.08);
  --shadow-raised: 0 6px 20px rgba(20,20,20,0.14);
}

/* ---------- Theme: Bahi Khata (default) ---------- */
[data-theme="bahi"]{
  --bg: #F3EEE0;
  --paper: #FBF8EF;
  --ink: #24304A;
  --ink-soft: #5B6478;
  --rule: #C9BFA0;
  --primary: #24304A;
  --primary-contrast: #FBF8EF;
  --accent: #C99A2E;
  --credit: #3E7A4F;
  --debit: #8C2F39;
  --card-alt: #EFE7D0;
}

/* ---------- Theme: Harvest Gold ---------- */
[data-theme="harvest"]{
  --bg: #FBF3DD;
  --paper: #FFFDF6;
  --ink: #4A3423;
  --ink-soft: #8A6F55;
  --rule: #E3CE9C;
  --primary: #A9711E;
  --primary-contrast: #FFFDF6;
  --accent: #C0392B;
  --credit: #4A7C59;
  --debit: #B03A2E;
  --card-alt: #F3E4BC;
}

/* ---------- Theme: Peepal Green ---------- */
[data-theme="peepal"]{
  --bg: #EDF3E7;
  --paper: #F8FBF5;
  --ink: #23361F;
  --ink-soft: #5C7455;
  --rule: #BFD4B4;
  --primary: #2D5F3E;
  --primary-contrast: #F8FBF5;
  --accent: #C9A227;
  --credit: #2D6A4F;
  --debit: #9C3B3B;
  --card-alt: #E1EBD8;
}

/* ---------- Theme: Diya Saffron ---------- */
[data-theme="diya"]{
  --bg: #FDF1E2;
  --paper: #FFFAF1;
  --ink: #4A2A1D;
  --ink-soft: #8C6650;
  --rule: #EBC79A;
  --primary: #D2601A;
  --primary-contrast: #FFFAF1;
  --accent: #A62639;
  --credit: #3E7A4F;
  --debit: #A62639;
  --card-alt: #F7E1C2;
}

/* ---------- Theme: Night Ledger (dark) ---------- */
[data-theme="night"]{
  --bg: #12141C;
  --paper: #1B1F2B;
  --ink: #EDE7D6;
  --ink-soft: #9BA0B4;
  --rule: #333952;
  --primary: #E8C468;
  --primary-contrast: #12141C;
  --accent: #E8C468;
  --credit: #6FBF8B;
  --debit: #E37B7B;
  --card-alt: #232839;
}

*{ box-sizing:border-box; }
html,body{ height:100%; }
body{
  margin:0;
  background:var(--bg);
  color:var(--ink);
  font-family:var(--font-body);
  -webkit-font-smoothing:antialiased;
  padding-bottom:24px; /* space for bottom nav */
}

h1,h2,h3,.display{
  font-family:var(--font-display);
  font-weight:600;
  letter-spacing:-0.01em;
  margin:0;
}

.mono, .amount{
  font-family:var(--font-mono);
  font-variant-numeric:tabular-nums;
}

/* ---------- Top bar ---------- */
.topbar{
  display:flex;
  align-items:center;
  gap:10px;
  padding:16px 18px 14px;
  background:var(--primary);
  color:var(--primary-contrast);
  position:sticky; top:0; z-index:20;
}
.stamp{
  width:38px; height:38px;
  border-radius:50%;
  border:2px solid var(--primary-contrast);
  display:flex; align-items:center; justify-content:center;
  font-family:var(--font-display);
  font-weight:700;
  font-size:16px;
  flex-shrink:0;
}
.topbar .titles{ line-height:1.15; }
.topbar .titles small{ opacity:0.75; font-size:11.5px; display:block; }

/* ---------- Page / cards ---------- */
.page{ padding:16px; max-width:640px; margin:0 auto; }
.card{
  background:var(--paper);
  border:1px solid var(--rule);
  border-radius:var(--radius-card);
  box-shadow:var(--shadow-card);
  padding:16px;
  margin-bottom:14px;
  position:relative;
}
.card.ledger::before{
  /* faint ruled lines like a khata page */
  content:"";
  position:absolute; inset:44px 0 12px 0;
  background-image:repeating-linear-gradient(
    to bottom, transparent, transparent 27px, var(--rule) 28px);
  opacity:0.35; pointer-events:none;
}
.card h3{ font-size:16px; margin-bottom:8px; }
.card-alt{ background:var(--card-alt); }

.grid-2{ display:grid; grid-template-columns:1fr 1fr; gap:12px; }
.grid-3{ display:grid; grid-template-columns:repeat(3,1fr); gap:10px; }

.stat{
  background:var(--paper);
  border:1px solid var(--rule);
  border-radius:var(--radius-card);
  padding:12px 14px;
}
.stat .label{ font-size:11.5px; color:var(--ink-soft); text-transform:uppercase; letter-spacing:.04em; }
.stat .value{ font-family:var(--font-mono); font-size:20px; font-weight:700; margin-top:4px; }
.stat .value.credit{ color:var(--credit); }
.stat .value.debit{ color:var(--debit); }

/* ---------- Buttons / inputs ---------- */
button{ font-family:var(--font-body); cursor:pointer; }
.btn{
  background:var(--primary); color:var(--primary-contrast);
  border:none; border-radius:10px; padding:11px 16px;
  font-size:14.5px; font-weight:600;
}
.btn.secondary{ background:transparent; color:var(--primary); border:1.5px solid var(--primary); }
.btn.danger{ background:var(--debit); color:#fff; }
.btn.block{ width:100%; }
.btn:disabled{ opacity:0.5; cursor:not-allowed; }

input, select, textarea{
  width:100%;
  border:1.5px solid var(--rule);
  background:var(--paper);
  color:var(--ink);
  border-radius:9px;
  padding:10px 12px;
  font-size:14.5px;
  font-family:var(--font-body);
}
label{ font-size:12.5px; color:var(--ink-soft); display:block; margin:10px 0 4px; }

/* ---------- Status pill / stamp badge ---------- */
.pill{
  display:inline-flex; align-items:center; gap:5px;
  padding:3px 10px; border-radius:var(--radius-pill);
  font-size:11.5px; font-weight:600; letter-spacing:.02em;
}
.pill.paid{ background:color-mix(in srgb, var(--credit) 18%, transparent); color:var(--credit); }
.pill.due{ background:color-mix(in srgb, var(--debit) 18%, transparent); color:var(--debit); }
.pill.pending{ background:color-mix(in srgb, var(--accent) 22%, transparent); color:var(--accent); }

.stamp-badge{
  display:inline-flex; align-items:center; justify-content:center;
  width:46px; height:46px; border-radius:50%;
  border:2px dashed var(--credit); color:var(--credit);
  transform:rotate(-8deg);
  font-family:var(--font-display); font-weight:700; font-size:10px;
  text-align:center; line-height:1.1;
}

/* ---------- Hamburger + side drawer nav ---------- */
.hamburger{
  background:none; border:1.5px solid var(--primary-contrast);
  color:var(--primary-contrast); border-radius:8px;
  width:38px; height:38px; flex-shrink:0;
  display:flex; align-items:center; justify-content:center;
  font-size:19px; margin-left:auto;
}
.drawer-backdrop{
  position:fixed; inset:0; background:rgba(0,0,0,0.45);
  z-index:40; opacity:0; pointer-events:none; transition:opacity 0.2s;
}
.drawer-backdrop.open{ opacity:1; pointer-events:auto; }
.drawer{
  position:fixed; top:0; left:0; bottom:0; width:78%; max-width:300px;
  background:var(--paper); z-index:41;
  transform:translateX(-100%); transition:transform 0.25s ease;
  display:flex; flex-direction:column;
  box-shadow:2px 0 18px rgba(0,0,0,0.25);
  padding-top:env(safe-area-inset-top);
}
.drawer.open{ transform:translateX(0); }
.drawer-head{
  padding:20px 18px; background:var(--primary); color:var(--primary-contrast);
  display:flex; align-items:center; gap:12px;
}
.drawer-nav{ flex:1; overflow-y:auto; padding:10px 0; }
.navbtn{
  background:none; border:none; color:var(--ink);
  display:flex; align-items:center; gap:14px; width:100%;
  font-size:15px; padding:13px 20px; text-align:left;
}
.navbtn.active{ color:var(--primary); font-weight:700; background:color-mix(in srgb, var(--primary) 8%, transparent); }
.navbtn .navicon{ font-size:19px; width:24px; text-align:center; }

/* ---------- Lists / rows ---------- */
.row{
  display:flex; align-items:center; justify-content:space-between;
  padding:11px 0; border-bottom:1px solid var(--rule);
}
.row:last-child{ border-bottom:none; }
.row .who{ font-weight:600; font-size:14.5px; }
.row .meta{ font-size:12px; color:var(--ink-soft); }

/* ---------- Theme swatches (settings) ---------- */
.swatch-row{ display:flex; gap:10px; flex-wrap:wrap; }
.swatch{
  width:52px; height:52px; border-radius:12px; border:2px solid transparent;
  cursor:pointer; position:relative;
}
.swatch.active{ border-color:var(--ink); }

/* ---------- Toast ---------- */
#toast{
  position:fixed; left:50%; bottom:90px; transform:translateX(-50%);
  background:var(--ink); color:var(--paper);
  padding:10px 18px; border-radius:var(--radius-pill);
  font-size:13.5px; opacity:0; pointer-events:none; transition:opacity .25s;
  z-index:50; max-width:88%; text-align:center;
}
#toast.show{ opacity:1; }

/* ---------- Modal ---------- */
.modal-backdrop{
  position:fixed; inset:0; background:rgba(0,0,0,0.45);
  display:none; align-items:flex-end; justify-content:center; z-index:40;
}
.modal-backdrop.show{ display:flex; }
.modal{
  background:var(--paper); width:100%; max-width:640px;
  border-radius:18px 18px 0 0; padding:18px; max-height:88vh; overflow-y:auto;
}
.modal .modal-head{ display:flex; justify-content:space-between; align-items:center; margin-bottom:10px; }
.modal .close{ background:none; border:none; font-size:20px; color:var(--ink-soft); }

.hidden{ display:none !important; }
.section-title{ font-size:12px; text-transform:uppercase; letter-spacing:.06em; color:var(--ink-soft); margin:18px 0 8px; }
.divider{ height:1px; background:var(--rule); margin:14px 0; }
/* ---------- Detail-view tables (member history, etc.) ---------- */
.detail-table-wrap{ overflow-x:auto; margin-bottom:14px; -webkit-overflow-scrolling:touch; }
table.detail-table{ width:100%; border-collapse:collapse; font-size:12.5px; white-space:nowrap; }
table.detail-table th, table.detail-table td{
  padding:7px 9px; text-align:left; border-bottom:1px solid rgba(0,0,0,0.08);
}
table.detail-table th{
  font-size:10.5px; text-transform:uppercase; letter-spacing:0.03em;
  color:var(--ink-soft); font-weight:600; background:rgba(0,0,0,0.03);
}
table.detail-table td.num{ text-align:right; font-variant-numeric:tabular-nums; }
table.detail-table tr:last-child td{ border-bottom:none; }

</style>

<!-- Safety net: if the app can't draw anything (e.g. Google's Firebase files
     are blocked or the connection is bad), say WHY instead of a blank screen. -->
<script>
(function(){
  var errs = [];
  function esc(t){ return String(t).replace(/[&<>"]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
  window.addEventListener('error', function(e){
    var t = e.target;
    if(t && t !== window && (t.tagName === 'SCRIPT' || t.tagName === 'LINK')){
      errs.push('Could not load: ' + (t.src || t.href));
    } else {
      errs.push((e.message || 'Script error') + (e.filename ? '  (' + e.filename.split('/').pop() + ':' + e.lineno + ')' : ''));
    }
  }, true);
  window.addEventListener('unhandledrejection', function(e){
    var r = e.reason;
    errs.push('Promise error: ' + ((r && (r.code || r.message)) || r));
  });
  setTimeout(function(){
    var app = document.getElementById('app');
    if(!app || app.innerHTML.replace(/\s/g,'') !== '') return; // app drew something - all good
    var why;
    if(typeof firebase === 'undefined'){
      why = "Google's Firebase files (gstatic.com) could not be loaded. Check that your internet works, try switching between Wi-Fi and mobile data, and turn off any ad-blocker or data-saver mode for this site.";
    } else if(errs.length){
      why = 'A script error stopped the app from starting. Details are below - please send a screenshot.';
    } else {
      why = 'Still connecting to Google servers - the connection looks very slow or blocked. Please try again.';
    }
    app.innerHTML =
      '<div style="max-width:380px;margin:16vh auto 0;padding:0 22px;font-family:system-ui,sans-serif;color:#24304A;text-align:center;">' +
      '<div style="width:56px;height:56px;border-radius:50%;border:2px solid #24304A;margin:0 auto 14px;line-height:52px;font-weight:700;font-size:20px;">DS</div>' +
      '<div style="font-size:19px;font-weight:700;margin-bottom:8px;">Demo Society could not start</div>' +
      '<div style="font-size:14px;line-height:1.55;margin-bottom:18px;">' + esc(why) + '</div>' +
      '<button onclick="location.reload()" style="background:#24304A;color:#FBF8EF;border:none;border-radius:10px;padding:11px 26px;font-size:15px;font-weight:600;">Try again</button>' +
      (errs.length ? '<details style="margin-top:18px;text-align:left;font-size:11.5px;"><summary>Technical details</summary><pre style="white-space:pre-wrap;word-break:break-word;">' + esc(errs.join('\n')) + '</pre></details>' : '') +
      '</div>';
  }, 8000);
})();
</script>

function fmtMoney(n){
  const v = Math.round((n || 0) * 100) / 100;
  return "\u20b9" + v.toLocaleString("en-IN", {maximumFractionDigits:2});
}

function monthKey(date){
  const d = date instanceof Date ? date : new Date(date);
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;
}

function monthLabel(key){
  const [y,m] = key.split('-').map(Number);
  return `${EN_MONTHS[m]} ${y}`;
}

function monthsBetween(startKey, endKey){
  const [sy, sm] = startKey.split('-').map(Number);
  const [ey, em] = endKey.split('-').map(Number);
  const months = [];
  let y = sy, m = sm;
  while(y < ey || (y === ey && m <= em)){
    months.push(`${y}-${String(m).padStart(2,'0')}`);
    m++;
    if(m > 12){ m = 1; y++; }
  }
  return months;
}


// Given any date, return the society "society year" it falls in,
// e.g. Nov 2025 -> "2025-2026" (Oct 2025 to Sep 2026)
function societyYearOf(date){
  const d = date instanceof Date ? date : new Date(date);
  const y = d.getFullYear(), m = d.getMonth()+1;
  if(m >= SOCIETY.yearStartMonth){
    return `${y}-${y+1}`;
  }
  return `${y-1}-${y}`;
}

function societyYearBounds(yearId){
  const [y1] = yearId.split('-').map(Number);
  const start = new Date(y1, SOCIETY.yearStartMonth-1, 1);
  const end = new Date(y1+1, SOCIETY.yearStartMonth-2, 28); // last day of Sep next year (safe-ish)
  return {start, end};
}

// All 12 month-keys of a society year, Oct -> Sep
function societyYearMonths(yearId){
  const [y1] = yearId.split('-').map(Number);
  const months = [];
  for(let i=0;i<12;i++){
    const m = SOCIETY.yearStartMonth + i;
    const yy = m > 12 ? y1+1 : y1;
    const mm = m > 12 ? m-12 : m;
    months.push(`${yy}-${String(mm).padStart(2,'0')}`);
  }
  return months;
}

function nextMonthKey(key){
  const [y,m] = key.split('-').map(Number);
  const d = new Date(y, m, 1); // rolls to next month
  return monthKey(d);
}

async function ensureDefaultAdminExists(){
  // Run this entirely on a throwaway secondary Firebase app instance so
  // it can never sign out (or otherwise disturb) whoever is actually
  // logged in on the main `auth` object.
  const secondary = firebase.initializeApp(firebaseConfig, "seedcheck-" + Date.now());
  try{
    try{
      await secondary.auth().signInWithEmailAndPassword(
        usernameToEmail(DEFAULT_ADMIN.username), DEFAULT_ADMIN.password);
      // Exists and default password still works \u2014 nothing to do.
      return;
    }catch(e){
      // auth/user-not-found means it genuinely doesn't exist yet \u2014
      // fall through and create it. Any other error (e.g. someone
      // already changed the password) \u2014 just stop; we don't want to
      // touch an existing account.
      if(e.code !== 'auth/user-not-found' && e.code !== 'auth/invalid-credential') return;
    }

    try{
      const cred = await secondary.auth().createUserWithEmailAndPassword(
        usernameToEmail(DEFAULT_ADMIN.username), DEFAULT_ADMIN.password);
      await db.collection('users').doc('admin').set({
        username: DEFAULT_ADMIN.username,
        uid: cred.user.uid,
        role: 'admin',
        isDefaultAdmin: true,
        createdAt: firebase.firestore.FieldValue.serverTimestamp()
      });
    }catch(e){
      console.warn("Default admin seed:", e.message);
    }
  } finally {
    await secondary.delete();
  }
}

  const loanDue = loanEntry ? Math.max(loanEntry.totalDue - (loanEntry.paymentMade||0), 0) : 0;

  openModal(`

    ${activeLoan ? `
      <label style="margin-top:12px;">Loan Amount (due ${fmtMoney(loanDue)})</label>
      <input id="cpLoanAmt" type="number" value="${loanDue}">
    ` : `<div class="meta" style="margin-top:12px;">No active loan for this member.</div>`}

    <button class="btn block" style="margin-top:16px;" onclick="submitCollectPayment('${id}', '${contrib?contrib.id:''}', '${loanEntry?loanEntry.id:''}')">Confirm Payment</button>
  `);
 } catch(err) {
   console.error('openCollectPayment failed:', err);
   toast('Error opening Collect Payment: ' + (err.message || err));
 }

async function submitCollectPayment(memberId, contribId, loanEntryId){
 try {

 }
}

// =====================================================
// Monthly share contributions
// Doc id = `${memberId}_${monthKey}` so it's naturally idempotent.
// =====================================================
async function ensureMonthContributions(mKey){
  const members = await getMembers(true);
  const batch = db.batch();
  let created = 0;
  for(const m of members){
    const id = `${m.id}_${mKey}`;
    const ref = db.collection('contributions').doc(id);
    const existing = await ref.get();
    if(existing.exists) continue;
    batch.set(ref, {
      memberId: m.id,
      memberName: m.name,
      month: mKey,
      yearId: societyYearOf(mKey + "-05"),
      sharesAtTime: m.sharesCount,
      amountDue: m.sharesCount * SOCIETY.shareValue,
      amountPaid: 0,
      status: 'unpaid',
      penaltyApplied: false,
      penaltyAmount: 0,
      createdAt: firebase.firestore.FieldValue.serverTimestamp()
    });
    created++;
  }
  if(created>0) await batch.commit();
  return created;
}

async function getContributionsForMonth(mKey){
  const snap = await db.collection('contributions').where('month','==',mKey).get();
  return snap.docs.map(d=>({id:d.id, ...d.data()})).sort((a,b)=> a.memberName.localeCompare(b.memberName));
}

async function markContributionPaid(id, amountPaid){
  const ref = db.collection('contributions').doc(id);
  const doc = (await ref.get()).data();
  const total = amountPaid;
  const status = total >= (doc.amountDue + (doc.penaltyAmount||0)) ? 'paid' : 'partial';
  await ref.set({
    amountPaid: total, status, paidDate: new Date().toISOString().slice(0,10)
  }, {merge:true});
}

async function syncDuesForMonth(mKey){
  const members = await getMembers(true);
  const memberById = {};
  members.forEach(m => memberById[m.id] = m);

  const list = await getContributionsForMonth(mKey);
  const batch = db.batch();
  let updated = 0;

  for(const c of list){
    const m = memberById[c.memberId];
    if(!m) continue;
    const newDue = m.sharesCount * SOCIETY.shareValue;
    if(newDue === c.amountDue && m.sharesCount === c.sharesAtTime) continue;

    const paid = c.amountPaid || 0;
    const totalOwed = newDue + (c.penaltyAmount || 0);
    const newStatus = paid >= totalOwed ? 'paid' : (paid > 0 ? 'partial' : 'unpaid');

    const ref = db.collection('contributions').doc(c.id);
    batch.set(ref, {
      sharesAtTime: m.sharesCount,
      amountDue: newDue,
      status: newStatus
    }, {merge:true});
    updated++;
  }
  if(updated>0) await batch.commit();
  return updated;
}

// =====================================================
// Loans \u2014 issued against a member's deposits.
// Each month unpaid: interest = 3% of the CURRENT outstanding
// balance (principal + any previously unpaid/compounded interest).
// If not paid, that new total simply becomes next month's
// opening balance \u2014 i.e. compound interest, month over month.
// =====================================================
async function issueLoan(memberId, memberName, principal, dateIssued){
  const yearId = societyYearOf(dateIssued);
  const ref = await db.collection('loans').add({
    memberId, memberName, principal, dateIssued, yearId,
    status: 'active',
    outstandingBalance: principal,
    lastProcessedMonth: null,
    createdAt: firebase.firestore.FieldValue.serverTimestamp()
  });
  return ref.id;
}

async function getActiveLoans(){
  const snap = await db.collection('loans').where('status','==','active').get();
  return snap.docs.map(d=>({id:d.id, ...d.data()}));
}

async function getMemberLoans(memberId){
  const snap = await db.collection('loans').where('memberId','==',memberId).get();
  return snap.docs.map(d=>({id:d.id, ...d.data()}));
}

async function getLoanLedger(loanId){
  const snap = await db.collection('loanLedger').where('loanId','==',loanId).get();
  return snap.docs.map(d=>({id:d.id, ...d.data()})).sort((a,b)=> a.month.localeCompare(b.month));
}

// Creates this month's interest entry for one loan, if not already done.
async function processLoanMonth(loanId, mKey){
  const loanRef = db.collection('loans').doc(loanId);
  const loan = (await loanRef.get()).data();
  if(loan.status !== 'active') return null;

  const existing = await db.collection('loanLedger')
    .where('loanId','==',loanId).where('month','==',mKey).limit(1).get();
  if(!existing.empty) return existing.docs[0].id;

  const ledger = await getLoanLedger(loanId); // sorted ascending by month
  // Use the entry immediately BEFORE mKey chronologically \u2014 not just
  // "whichever entry happens to be last in the list" \u2014 so processing
  // months out of order (e.g. a top-up mistakenly dated earlier than
  // an existing entry) can never scramble the running balance.
  const prior = ledger.filter(e => e.month < mKey).pop();
  const opening = prior ? prior.closingBalance : loan.principal;

  // No interest in the month the loan was actually issued \u2014 it only
  // starts accruing from the following month onward.
  const issuanceMonth = (loan.dateIssued || '').slice(0,7);
  const isIssuanceMonth = mKey === issuanceMonth;
  const interest = isIssuanceMonth ? 0 : Math.round(opening * (SOCIETY.monthlyInterestPct/100) * 100) / 100;
  const totalDue = Math.round((opening + interest) * 100) / 100;

  const ref = await db.collection('loanLedger').add({
    loanId, memberId: loan.memberId, memberName: loan.memberName,
    month: mKey, yearId: societyYearOf(mKey + "-05"),
    openingBalance: opening, interest, totalDue,
    paymentMade: 0, topupAmount: 0, closingBalance: totalDue, status: 'carried',
    createdAt: firebase.firestore.FieldValue.serverTimestamp()
  });
  await loanRef.set({outstandingBalance: totalDue, lastProcessedMonth: mKey}, {merge:true});
  return ref.id;
}

// Adds extra loan amount ("top-up") to an existing loan within a given
// month, instead of creating a brand new loan record. This keeps one
// continuous running balance per member, matching the register-style
// ledger (Month / Loan Balance / Interest / Repayment / Loan Taken).
async function addLoanTopup(loanId, mKey, amount){
  await processLoanMonth(loanId, mKey); // ensure this month's row exists
  const snap = await db.collection('loanLedger')
    .where('loanId','==',loanId).where('month','==',mKey).limit(1).get();
  if(snap.empty) return;
  const entryRef = snap.docs[0].ref;
  const entry = snap.docs[0].data();
  const newClosing = Math.round((entry.closingBalance + amount) * 100) / 100;
  await entryRef.set({
    topupAmount: (entry.topupAmount||0) + amount,
    closingBalance: newClosing,
    status: 'carried'
  }, {merge:true});
  await db.collection('loans').doc(loanId).set({
    outstandingBalance: newClosing, status: 'active'
  }, {merge:true});
}

async function processAllLoansForMonth(mKey){
  const loans = await getActiveLoans();
  for(const l of loans) await processLoanMonth(l.id, mKey);
  return loans.length;
}

// Automatically back-fills every missing month's interest entry for a
// loan, from the month it was issued up through the current month \u2014
// so nobody has to remember to tap "Run" each month. Safe to call
// repeatedly; processLoanMonth() itself skips months already done.
async function ensureLoanCaughtUp(loanId){
  const doc = await db.collection('loans').doc(loanId).get();
  if(!doc.exists) return;
  const loan = doc.data();
  if(loan.status !== 'active') return;
  const startMonth = (loan.dateIssued || '').slice(0,7);
  const endMonth = monthKey(new Date());
  if(!startMonth) return;
  for(const mk of monthsBetween(startMonth, endMonth)){
    await processLoanMonth(loanId, mk);
  }
}

async function ensureAllLoansCaughtUp(){
  const loans = await getActiveLoans();
  for(const l of loans) await ensureLoanCaughtUp(l.id);
}

async function recordLoanPayment(ledgerId, paymentAmount){
  const ref = db.collection('loanLedger').doc(ledgerId);
  const entry = (await ref.get()).data();
  const closing = Math.round((entry.totalDue - paymentAmount) * 100) / 100;
  const status = closing <= 0 ? 'paid' : 'carried';
  await ref.set({paymentMade: paymentAmount, closingBalance: Math.max(closing,0), status}, {merge:true});

  const loanRef = db.collection('loans').doc(entry.loanId);
  if(closing <= 0){
    await loanRef.set({status:'closed', outstandingBalance:0}, {merge:true});
  } else {
    await loanRef.set({outstandingBalance: closing}, {merge:true});
  }
}

async function deleteLoan(loanId){
  const ledger = await getLoanLedger(loanId);
  const batch = db.batch();
  ledger.forEach(e => batch.delete(db.collection('loanLedger').doc(e.id)));
  batch.delete(db.collection('loans').doc(loanId));
  await batch.commit();
}

async function updateLoanDetails(loanId, principal, dateIssued){
  const loanRef = db.collection('loans').doc(loanId);
  const loan = (await loanRef.get()).data();
  const yearId = societyYearOf(dateIssued);
  const ledger = await getLoanLedger(loanId);
  const update = {principal, dateIssued, yearId};
  if(ledger.length === 0){
    update.outstandingBalance = principal;
  }
  await loanRef.set(update, {merge:true});
}

async function undoLoanPayment(ledgerId){
  const ref = db.collection('loanLedger').doc(ledgerId);
  const entry = (await ref.get()).data();
  await ref.set({paymentMade: 0, closingBalance: entry.totalDue, status:'carried'}, {merge:true});
  await db.collection('loans').doc(entry.loanId).set({status:'active', outstandingBalance: entry.totalDue}, {merge:true});
}

// Removes one bad/duplicate monthly ledger entry (e.g. one created for
// the wrong month) and recomputes the loan's outstandingBalance from
// whatever entry is now the most recent one left.
async function deleteLoanLedgerEntry(entryId, loanId){
  if(!confirm('Delete this month\'s loan entry? This cannot be undone.')) return;
  await db.collection('loanLedger').doc(entryId).delete();
  const remaining = await getLoanLedger(loanId);
  const newOutstanding = remaining.length ? remaining[remaining.length-1].closingBalance : (await db.collection('loans').doc(loanId).get()).data().principal;
  await db.collection('loans').doc(loanId).set({
    outstandingBalance: newOutstanding,
    lastProcessedMonth: remaining.length ? remaining[remaining.length-1].month : null
  }, {merge:true});
  openLoanDetail(loanId);
}

async function showMemberWiseReport(){
  const yearId = document.getElementById('reportYear').value.trim();
  const snap = await db.collection('contributions').where('yearId','==',yearId).get();
  const rows = snap.docs.map(d=>d.data());
  const byMember = {};
  for(const r of rows){
    byMember[r.memberId] = byMember[r.memberId] || {name:r.memberName, due:0, paid:0, penalty:0};
    byMember[r.memberId].due += r.amountDue;
    byMember[r.memberId].paid += r.amountPaid || 0;
    byMember[r.memberId].penalty += r.penaltyAmount || 0;
  }
  const list = Object.values(byMember).sort((a,b)=>a.name.localeCompare(b.name));
  const totalDue = list.reduce((s,m)=>s+m.due+m.penalty,0);
  const totalPaid = list.reduce((s,m)=>s+m.paid,0);

  document.getElementById('reportOutput').innerHTML = `

      <div class="stat"><div class="label">Total Due (${yearId})</div><div class="value">${fmtMoney(totalDue)}</div></div>

          </div>
        </div>`).join('') || '<div class="meta">No contribution records for this year yet.</div>'}
    </div>`;
}

async function showBalanceSheet(){
  const yearId = document.getElementById('reportYear').value.trim();
  const months = societyYearMonths(yearId);

  const contribSnap = await db.collection('contributions').where('yearId','==',yearId).get();
  const contribs = contribSnap.docs.map(d=>d.data());
  const loanLedgerSnap = await db.collection('loanLedger').where('yearId','==',yearId).get();
  const ledgerRows = loanLedgerSnap.docs.map(d=>d.data());
  const loansSnap = await db.collection('loans').where('yearId','==',yearId).get();
  const loansIssued = loansSnap.docs.map(d=>d.data());

  const perMonth = months.map(mKey=>{
    const contribsThisMonth = contribs.filter(c=>c.month===mKey);
    const collected = contribsThisMonth.reduce((s,c)=>s+(c.amountPaid||0),0);
    const interestAccrued = ledgerRows.filter(l=>l.month===mKey).reduce((s,l)=>s+l.interest,0);
    const newLoans = loansIssued.filter(l=>l.dateIssued && monthKey(l.dateIssued)===mKey)
      .reduce((s,l)=>s+l.principal,0);
    return {mKey, collected, interestAccrued, newLoans};
  });

  const aggCollected = perMonth.reduce((s,m)=>s+m.collected,0);
  const aggInterest = perMonth.reduce((s,m)=>s+m.interestAccrued,0);
  const aggLoans = perMonth.reduce((s,m)=>s+m.newLoans,0);

  document.getElementById('reportOutput').innerHTML = `
    <div class="grid-3" style="margin-bottom:14px;">
      <div class="stat"><div class="label">Shares Collected</div><div class="value credit">${fmtMoney(aggCollected)}</div></div>
      <div class="stat"><div class="label">Interest Income</div><div class="value credit">${fmtMoney(aggInterest)}</div></div>
      <div class="stat"><div class="label">Loans Issued</div><div class="value debit">${fmtMoney(aggLoans)}</div></div>
    </div>
    <div class="card ledger">
      <h3 style="margin-bottom:10px;">Month-wise (${yearId})</h3>
      ${perMonth.map(m=>`
        <div class="row">
          <div class="who">${monthLabel(m.mKey)}</div>
          <div style="text-align:right; font-size:12.5px;">
            <div class="amount">Shares: ${fmtMoney(m.collected)}</div>
            <div class="meta">Interest: ${fmtMoney(m.interestAccrued)} \u00b7 New loans: ${fmtMoney(m.newLoans)}</div>
          </div>
        </div>`).join('')}
    </div>`;
}

async function computeYearFinancials(yearId){
  const contribSnap = await db.collection('contributions').where('yearId','==',yearId).get();
  const contribs = contribSnap.docs.map(d=>d.data());
  const penaltyIncome = contribs.reduce((s,c)=> s + (c.penaltyApplied ? c.penaltyAmount : 0), 0);

  const ledgerSnap = await db.collection('loanLedger').where('yearId','==',yearId).get();
  const interestIncome = ledgerSnap.docs.reduce((s,d)=> s + d.data().interest, 0);

  const members = await getMembers();
  const totalShares = members.reduce((s,m)=> s + (m.sharesCount||0), 0);

  return {interestIncome, penaltyIncome, totalShares, members};
}

async function calcYearEnd(){
  const yearId = document.getElementById('yeYear').value.trim();
  const otherIncome = parseFloat(document.getElementById('yeOtherIncome').value || '0');
  const expenses = parseFloat(document.getElementById('yeExpenses').value || '0');
  const fin = await computeYearFinancials(yearId);
  const totalProfit = fin.interestIncome + fin.penaltyIncome + otherIncome - expenses;
  const suggestedPerShare = fin.totalShares > 0 ? Math.round((totalProfit/fin.totalShares)*100)/100 : 0;

  document.getElementById('yeOutput').innerHTML = `
    <div class="grid-2" style="margin-bottom:14px;">
      <div class="stat"><div class="label">Total Profit</div><div class="value credit">${fmtMoney(totalProfit)}</div></div>

    </div>
    <div class="card">
      <div class="meta">Interest income ${fmtMoney(fin.interestIncome)} + Penalty income ${fmtMoney(fin.penaltyIncome)} + Other ${fmtMoney(otherIncome)} \u2212 Expenses ${fmtMoney(expenses)}</div>

}

  const approved = parseFloat(document.getElementById('yeApprovedPerShare').value || '0');
  const members = await getMembers();
  const rows = members.map(m=>({
    memberId: m.id, name: m.name, shares: m.sharesCount||0,
    payout: Math.round((m.sharesCount||0) * approved * 100) / 100
  }));
  const totalPayout = rows.reduce((s,r)=>s+r.payout,0);

  document.getElementById('yeDistribution').innerHTML = `
    <div class="card ledger">
      <h3>Member Payouts \u2014 ${yearId}</h3>
      <div class="meta">Approved rate: ${fmtMoney(approved)}/share \u00b7 Total distributed: ${fmtMoney(totalPayout)}</div>
      <div class="divider"></div>
      ${rows.map(r=>`
        <div class="row">
          <div>
            <div class="who">${escapeHtml(r.name)}</div>
            <div class="meta">${r.shares} shares</div>
          </div>
          <div class="amount credit">${fmtMoney(r.payout)}</div>
        </div>`).join('')}
      <button class="btn block" style="margin-top:14px;" onclick='closeYear("${yearId}", ${JSON.stringify({totalProfit, approved, totalPayout})})'>Close Year &amp; Save Record</button>
    </div>`;

  window._pendingDistributionRows = rows;
}

async function closeYear(yearId, summary){
  const batch = db.batch();
  const yearRef = db.collection('years').doc(yearId);
  batch.set(yearRef, {
    yearId, status:'closed', totalProfit: summary.totalProfit,
    approvedPerShare: summary.approved, totalPayout: summary.totalPayout,
    closedAt: firebase.firestore.FieldValue.serverTimestamp()
  }, {merge:true});
  for(const r of (window._pendingDistributionRows||[])){
    const ref = db.collection('distributions').doc(`${yearId}_${r.memberId}`);
    batch.set(ref, {yearId, memberId:r.memberId, memberName:r.name, shares:r.shares, payout:r.payout});
  }
  await batch.commit();
  toast('Year closed and payout record saved.');
}

// Dashboard

async function renderDashboard(){
  const container = document.getElementById('viewDashboard');
  const mKey = monthKey(new Date());
  const members = await getMembers(true);
  const totalShares = members.reduce((s,m)=>s+(m.sharesCount||0),0);

  await ensureMonthContributions(mKey);
  const contribs = await getContributionsForMonth(mKey);
  const collected = contribs.reduce((s,c)=>s+(c.amountPaid||0),0);
  const dueTotal = contribs.reduce((s,c)=>s+c.amountDue+(c.penaltyAmount||0),0);
  const unpaidCount = contribs.filter(c=>c.status!=='paid').length;

  const activeLoans = await getActiveLoans();
  const totalOutstanding = activeLoans.reduce((s,l)=>s+(l.outstandingBalance||0),0);

  const today = new Date().getDate();
  const currentYear = societyYearOf(new Date());

  container.innerHTML = `
    <div class="card" style="cursor:pointer;" onclick="switchTab('shares')">
      <h3>${monthLabel(mKey)}</h3>
      <div class="grid-2">
        <div class="stat"><div class="label">Collected</div><div class="value credit">${fmtMoney(collected)}</div></div>
        <div class="stat"><div class="label">Pending</div><div class="value debit">${fmtMoney(Math.max(dueTotal-collected,0))}</div></div>
      </div>
    </div>
    <div class="grid-2">
      <div class="stat" style="cursor:pointer;" onclick="switchTab('members')"><div class="label">Active Members</div><div class="value">${members.length}</div></div>
      <div class="stat" style="cursor:pointer;" onclick="switchTab('members')"><div class="label">Total Shares</div><div class="value">${totalShares}</div></div>
    </div>
    <div class="grid-2">
      <div class="stat" style="cursor:pointer;" onclick="switchTab('loans')"><div class="label">Loans Outstanding</div><div class="value debit">${fmtMoney(totalOutstanding)}</div></div>
      <div class="stat" style="cursor:pointer;" onclick="switchTab('shares')"><div class="label">Unpaid This Month</div><div class="value">${unpaidCount}</div></div>
    </div>
    ${today >= SOCIETY.reminderDay && unpaidCount > 0 ? `
      <div class="card card-alt">
        <div class="row" style="border:none; padding:0;">
          <div>
            <div class="who">Reminder day</div>
            <div class="meta">${unpaidCount} member(s) haven't paid yet.</div>
          </div>
          <button class="btn" onclick="switchTab('reminders')">Open</button>
        </div>
      </div>` : ''}
    <div class="card" style="cursor:pointer;" onclick="switchTab('yearend')">
      <div class="section-title">Society Year</div>
      <div class="meta">Current tenure: <b>${currentYear}</b> (Oct \u2192 Sep)</div>
    </div>`;
}

function openClearAllDataConfirm(){
  openModal(`
    <div class="modal-head"><h3>Clear All Data?</h3><button class="close" onclick="closeModal()">\u2715</button></div>
    <div class="meta">This deletes <b>every</b> member, share payment, loan, ledger entry, and year-end record \u2014 permanently, with no undo. Your login and any staff logins are kept.</div>
    <label>Type <b>DELETE</b> to confirm</label>
    <input id="wipeConfirmText" autocapitalize="off" placeholder="DELETE">
    <button class="btn danger block" style="margin-top:14px;" onclick="submitClearAllData()">Erase Everything</button>
  `);
}

async function submitClearAllData(){
  const val = document.getElementById('wipeConfirmText').value.trim();
  if(val !== 'DELETE'){ toast('Type DELETE exactly to confirm.'); return; }
  await clearAllSocietyData();
  closeModal();
  toast('All society data cleared.');
  renderDashboard();
  renderSettings();
}

// Deletes every document across the society's data collections \u2014
// members, contributions, loans, loanLedger, years, distributions.
// Deliberately leaves the `users` collection (logins) untouched.
async function clearAllSocietyData(){
  const collections = ['members','contributions','loans','loanLedger','years','distributions'];
  for(const col of collections){
    const snap = await db.collection(col).get();
    const docs = snap.docs;
    for(let i=0; i<docs.length; i+=450){
      const batch = db.batch();
      docs.slice(i, i+450).forEach(d => batch.delete(d.ref));
      await batch.commit();
    }
  }
}

  loans:'viewLoans', reminders:'viewReminders', reports:'viewReports',
  yearend:'viewYearEnd', settings:'viewSettings'
};

  dashboard: renderDashboard, members: renderMembers, shares: renderContributions,
  loans: renderLoans, reminders: renderReminders, reports: renderReports,
  yearend: renderYearEnd, settings: renderSettings
};

function switchTab(tabId){
  TABS.forEach(t=>{
    document.getElementById(VIEW_ID[t.id]).classList.toggle('hidden', t.id!==tabId);
    document.getElementById('nav-'+t.id).classList.toggle('active', t.id===tabId);
  });
  RENDER_FN[tabId]();
  closeDrawer();
  window.scrollTo(0,0);
}
